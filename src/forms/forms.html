<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Обратная связь</title>
    <link rel="stylesheet" href="../../styles/form.css" />
  </head>
  <body>
    <a href="../../index.html#forms" class="home-btn"><span>←</span> На главную</a>
    <form class="block-center form">
      <!-- BEGIN (write your solution here) -->
      <h1>Обратная связь</h1>
      <div class="form-input mb-2">
        <label for="name" class="sr-only">Ваше имя</label>
        <input type="text" name="name" placeholder="Ваше имя" />
      </div>
      <div class="form-input mb-2">
        <label for="email" class="sr-only">Ваш Email</label>
        <input type="email" name="email" placeholder="Ваш Email" />
      </div>
      <div class="form-input mb-2">
        <textarea placeholder="Ваше сообщение"></textarea>
      </div>
      <div class="small mb-1">
        <input type="checkbox" name="accept-rules" placeholder="Ваш Email" />
        <label for="accept-rules" class="">Я принимаю правила сервиса</label>
      </div>

      <!-- END -->
      <button class="btn btn-green">Отправить сообщение</button>
    </form>
  </body>
</html>
